name: Update grocery prices

# Keeps data/grocery-prices.json current so the app can download it.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prices.yml"
      - "tools/fetch_prices.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest prices
        run: python3 tools/fetch_prices.py
      - name: Save if anything changed
        run: |
          if git diff --quiet -- data/grocery-prices.json; then
            echo "No new prices."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/grocery-prices.json
            git commit -m "Update grocery prices"
            git push
          fi
